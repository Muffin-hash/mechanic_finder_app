name: untitled2
description: "ClearDrive Role Selection Screen"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

  # Added provider for state management
  provider: ^6.1.1

  # Added Supabase for backend
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints for good coding practices
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # NOTE: We are omitting the explicit font assets so the app runs
  # instantly without requiring you to download font files.
  # It will use the system default font.
  #
  # If you want the exact 'Inter' font later, download the .ttf files,
  # put them in assets/fonts/, and uncomment the lines below:
  #
  # assets:
  #   - assets/fonts/
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800